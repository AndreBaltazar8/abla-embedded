name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Every host test (tests/*.ab, tests/fakes/<name>/): the programs with a `main` are built and run, the ones that only export their test entry are
  # built as x86-64 objects (tools/check-native-buffer-host runs them below 4 GiB with opt and llc, which a hosted runner has no matching version of), and
  # the firmware-target ones (`*-target.ab`) are not built here. tools/host-known-failures.txt lists what fails today; it only shrinks.
  # The Xtensa examples (make blink ...) are not built in CI: they need the Xtensa companion toolchain, which a hosted runner installs in about forty
  # minutes through an unpublished-artifact installer (see ablac's xtensa-companion-install job). Build them locally with tools/build-example.
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: AndreBaltazar8/setup-abla@f13f659af61ed16f0f2568964ff5b5f3344ec70a # main, signed Abla v0.2.67+ support
        with:
          version: '0.2.73'
      - name: Host tests, shard ${{ matrix.shard }} of 4
        run: tools/test-host --shard ${{ matrix.shard }}/4 --jobs "$(nproc)"
      - name: Logs of the failures
        if: failure()
        run: |
          for f in build/test-host/log/*.log; do
            printf '::group::%s\n' "$f"; head -c 4000 "$f"; printf '\n::endgroup::\n'
          done

  # Calls from IRAM into flash in the sleep and wake code (tools/check-iram-calls): the S3 sleep examples built as
  # release Xtensa objects and compared with tools/iram-calls-allowed.txt, which only shrinks (the C5 ones need an LLVM 23
  # with the RISC-V target and are checked locally). Xtensa objects need the Abla toolchain's Xtensa LLVM companion
  # (abla-install-xtensa, a verified download into the toolchain) and the external assembler root (the Espressif LLVM
  # archive tools/setup pins); both are cached, keyed by the pinned versions and hashes: about 45 s with a cache hit.
  iram-calls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ABLA_VERSION: '0.2.73'
      XTENSA_COMPANION: 23.1.3-2
      XTENSA_COMPANION_SHA256: ed88c893ef1a6e7113e86e9b0684e24fa9cc39da0ccf9550ced872323b854c18
      ESP_CLANG_URL: https://github.com/espressif/llvm-project/releases/download/esp-21.1.3_20260408/clang-esp-21.1.3_20260408-x86_64-linux-gnu.tar.xz
      ESP_CLANG_SHA256: 6e62bf1973b57b5388aad281ce1463e953e70b3d8df74ef4668c70f31fbeda63
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: AndreBaltazar8/setup-abla@f13f659af61ed16f0f2568964ff5b5f3344ec70a # main, signed Abla v0.2.67+ support
        with:
          version: ${{ env.ABLA_VERSION }}
      - name: Toolchain paths
        run: |
          echo "ABLA_TOOLCHAIN_BIN=$(dirname "$(command -v ablac)")" >> "$GITHUB_ENV"
          echo "XTENSA_LLVM_DIR=$(cd "$(dirname "$(command -v ablac)")/.." && pwd)/lib/abla/xtensa-llvm" >> "$GITHUB_ENV"
          echo "ESP_CLANG_DIR=$RUNNER_TEMP/esp-clang" >> "$GITHUB_ENV"
      - name: Cached Xtensa companion and Espressif LLVM
        id: cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.XTENSA_LLVM_DIR }}
            ${{ env.ESP_CLANG_DIR }}
          key: iram-tools-abla-${{ env.ABLA_VERSION }}-xtensa-${{ env.XTENSA_COMPANION }}-${{ env.XTENSA_COMPANION_SHA256 }}-esp-${{ env.ESP_CLANG_SHA256 }}
      - name: Install the Xtensa companion and the Espressif LLVM (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          time "$ABLA_TOOLCHAIN_BIN/abla-install-xtensa" --version "$XTENSA_COMPANION"
          archive=$RUNNER_TEMP/clang-esp.tar.xz
          curl -fsSL -o "$archive" "$ESP_CLANG_URL"
          echo "$ESP_CLANG_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
      - name: Verify the cached companion
        run: time "$ABLA_TOOLCHAIN_BIN/abla-install-xtensa" --verify
      - name: Calls from IRAM into flash
        run: |
          # The S3 (Xtensa) programs: the runner has no LLVM 23 with the RISC-V target, so the C5 ones are checked locally.
          export ABLA_ESP_LLVM_ROOT=$ESP_CLANG_DIR PATH=$ABLA_TOOLCHAIN_BIN:$PATH IRAM_LLVM_BIN=$ESP_CLANG_DIR/bin
          time tools/check-iram-calls --only-triple xtensa-esp-unknown-elf
      - name: The calls found, and the first build log
        if: failure()
        run: |
          cat build/check-iram-calls/calls.txt || true
          for f in build/check-iram-calls/*.log; do printf '::group::%s\n' "$f"; head -c 3000 "$f"; printf '\n::endgroup::\n'; break; done
