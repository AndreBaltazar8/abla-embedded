# Recovery profile for the classic ESP32: the reference chip whose Wi-Fi
# stack is already recovered under src/. See RADIO.md and RADIO-S3.md.
chip = "esp32"
objdump = "~/.espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32-elf-objdump"
idf = "~/.cache/abla-embedded/esp-idf-v6.0.2"
# reconstruct-xtensa-object's ioctl local-symbol renames match the classic
# hand-written ioctl module.
classic_compatibility_symbols = true
rom_linker_scripts = [
    "components/esp_rom/esp32/ld/esp32.rom.ld",
    "components/esp_rom/esp32/ld/esp32.rom.api.ld",
]

[archives]
libnet80211 = "components/esp_wifi/lib/esp32/libnet80211.a"
libpp = "components/esp_wifi/lib/esp32/libpp.a"
libcore = "components/esp_wifi/lib/esp32/libcore.a"
libespnow = "components/esp_wifi/lib/esp32/libespnow.a"
libmesh = "components/esp_wifi/lib/esp32/libmesh.a"
libsmartconfig = "components/esp_wifi/lib/esp32/libsmartconfig.a"
libwapi = "components/esp_wifi/lib/esp32/libwapi.a"
libcoexist = "components/esp_coex/lib/esp32/libcoexist.a"
libphy = "components/esp_phy/lib/esp32/libphy.a"
librtc = "components/esp_phy/lib/esp32/librtc.a"
