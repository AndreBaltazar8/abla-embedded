# Recovery profile for the ESP32-S3 (Paper Mono, PaperS3, CoreS3).
# The S3 links part of its Wi-Fi MAC from mask ROM: functions named in the
# ROM linker scripts are a platform interface and are not recovered.
chip = "esp32s3"
objdump = "~/.espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32s3-elf-objdump"
idf = "~/.cache/abla-embedded/esp-idf-v6.0.2"
# Functions matching the reference chip's build reuse its recovered Abla.
reference = "esp32"
# Standard calls lowered to Abla in an assembled unit; the classic esp32/ and
# network/ implementations encode classic ROM/peripheral details.
standard_call_modules = ["runtime/"]
# Memory-block calls stay calls to the ROM implementation: recovered code
# also copies into peripheral registers (hal_crypto_set_key_entry memcpys the
# cipher key into the MAC key file), where only ROM memcpy's 32-bit word
# accesses work.
standard_call_exclude = ["memcpy", "memmove", "memset", "bzero"]
rom_linker_scripts = [
    "components/esp_rom/esp32s3/ld/esp32s3.rom.ld",
    "components/esp_rom/esp32s3/ld/esp32s3.rom.api.ld",
]

# libphy declares globals as COMMON symbols; the unit must allocate them or
# the archive member that defines them is pulled in and collides.
common_data = true

[archives]
libnet80211 = "components/esp_wifi/lib/esp32s3/libnet80211.a"
libpp = "components/esp_wifi/lib/esp32s3/libpp.a"
libcore = "components/esp_wifi/lib/esp32s3/libcore.a"
libespnow = "components/esp_wifi/lib/esp32s3/libespnow.a"
libmesh = "components/esp_wifi/lib/esp32s3/libmesh.a"
libsmartconfig = "components/esp_wifi/lib/esp32s3/libsmartconfig.a"
libwapi = "components/esp_wifi/lib/esp32s3/libwapi.a"
libcoexist = "components/esp_coex/lib/esp32s3/libcoexist.a"
libphy = "components/esp_phy/lib/esp32s3/libphy.a"
libbtbb = "components/esp_phy/lib/esp32s3/libbtbb.a"

# Opt-in feature profiles (`tools/assemble-recovered-unit --features sta`, or
# ABLA_FEATURES=sta for tools/build-recovered-radio). An application that
# never uses a Wi-Fi feature can have the recovered registration code skip it:
# the registration is the only thing keeping the feature's functions
# reachable, so --gc-sections then drops them. Each rewrite names the function
# (original ABI symbol), the function addresses it must not store
# (`null_addresses`) and the direct calls it must not make (`skip_calls`).
# Behaviour for the features an application does use is unchanged; every entry
# below lists why a station never reaches what it removes.
[features.sta]
description = "station only: no softAP (hostap) and no fine timing measurement (FTM)"

# softAP. net80211_softap_funcs_init fills the AP slots of the net80211_funcs
# table. Their only callers are the mode-gated ioctl handlers (do_wifi_start /
# do_wifi_stop run it only for AP and APSTA modes; wifi_stop_process,
# wifi_set_config_process, esp_wifi_get_config test the slot for 0 first and
# return ESP_ERR_INVALID_ARG-style 258 or skip) and the AP receive path
# (ampdu_dispatch and ap_rx_cb call slot 132 only for frames of the AP vif,
# which exists only after wifi_softap_start). The hostap timer slots (types 9
# and 12) are only armed by the AP vif, and ieee80211_timer_do_process checks
# the handler for 0.
[[features.sta.rewrite]]
function = "net80211_softap_funcs_init"
null_addresses = [
    "hostap_input",
    "wifi_create_softap",
    "wifi_destroy_softap",
    "wifi_softap_start",
    "wifi_softap_stop",
    "wifi_softap_set_config",
    "wifi_softap_get_config",
    "wifi_softap_cur_max_ap_bss_num",
]
skip_calls = ["ieee80211_register_hostap_timer"]

# FTM. ieee80211_ftm_attach registers the public-action FTM request/response
# handlers (ieee80211_recv_action returns 0 for an empty slot), two tx
# callbacks for FTM frame types 14/15 (only FTM frames use them), the FTM
# timer slot (checked for 0 by ieee80211_timer_do_process) and the pp
# timestamp callbacks (wdev_ftm_set_callbacks; the three g_wdev_*_t1t4/t2t3
# callbacks are each tested for 0 before use). ieee80211_ftm_detach makes no
# calls. A station never starts an FTM session (esp_wifi_ftm_initiate_session
# and the responder configuration live in esp_wifi and are not called).
[[features.sta.rewrite]]
function = "ieee80211_ifattach"
skip_calls = ["ieee80211_ftm_attach"]
