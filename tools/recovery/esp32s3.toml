# Recovery profile for the ESP32-S3 (Paper Mono, PaperS3, CoreS3).
# The S3 links part of its Wi-Fi MAC from mask ROM: functions named in the
# ROM linker scripts are a platform interface and are not recovered.
chip = "esp32s3"
objdump = "~/.espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32s3-elf-objdump"
idf = "~/.cache/abla-embedded/esp-idf-v6.0.2"
# Functions matching the reference chip's build reuse its recovered Abla.
reference = "esp32"
rom_linker_scripts = [
    "components/esp_rom/esp32s3/ld/esp32s3.rom.ld",
    "components/esp_rom/esp32s3/ld/esp32s3.rom.api.ld",
]

[archives]
libnet80211 = "components/esp_wifi/lib/esp32s3/libnet80211.a"
libpp = "components/esp_wifi/lib/esp32s3/libpp.a"
libcore = "components/esp_wifi/lib/esp32s3/libcore.a"
libcoexist = "components/esp_coex/lib/esp32s3/libcoexist.a"
libphy = "components/esp_phy/lib/esp32s3/libphy.a"
libbtbb = "components/esp_phy/lib/esp32s3/libbtbb.a"
