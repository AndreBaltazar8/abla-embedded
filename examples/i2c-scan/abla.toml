# No `name`: a manifest with a package name bounds the compile-time paths at its own directory, and this example's build.ab writes build/examples/ at the repository root.
# This example's I2C backend: the shared register helpers name no backend, the program's manifest does.
# (Flat: the example's own modules still use names they reach through their imports.)
visibility = "imports"

[imports]
"../../src/i2c/device.ab" = "../../src/esp32/i2c_idf6.ab"
